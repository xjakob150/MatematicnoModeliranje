<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | Coding Giants</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-100 via-orange-50 to-slate-200">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 p-8 sm:rounded-2xl shadow-none sm:shadow-2xl border-none sm:border border-orange-100 flex flex-col justify-center">
        <div class="text-center mb-10">
            <span class="text-orange-500 font-bold text-5xl">&lt;/&gt;</span>
            <h2 class="text-3xl font-bold text-gray-800 mt-4">Prijava</h2>
            <p class="text-gray-500">Dobrodošli nazaj.</p>
        </div>

        <div id="error" class="mb-6 p-4 bg-red-100 text-red-700 rounded-xl text-sm hidden"></div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full px-4 py-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none bg-gray-50 text-lg">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Geslo</label>
                <input type="password" id="geslo" class="w-full px-4 py-3.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none bg-gray-50 text-lg">
            </div>

            <button onclick="login()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform text-lg">
                Prijavi se
            </button>
        </div>

        <p class="mt-10 text-center text-gray-600">
            Še nimaš računa?
            <a href="/registracija-stran" class="text-orange-600 font-bold">Registriraj se</a>
        </p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const geslo = document.getElementById("geslo").value;
            const errorDiv = document.getElementById("error");

            errorDiv.classList.add("hidden");

            try {
                const response = await fetch("/prijava", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        geslo
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    window.location.href = "/index.html";
                } else {
                    errorDiv.innerText = data.napaka || "Napaka pri prijavi.";
                    errorDiv.classList.remove("hidden");
                }

            } catch (err) {
                errorDiv.innerText = "Napaka pri povezavi s strežnikom.";
                errorDiv.classList.remove("hidden");
                console.error(err);
            }
        }
    </script>

</body>
</html>
