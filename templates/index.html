<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Giants Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <div class="main-container">

        <nav class="navbar">
            <div class="nav-content">
                <span class="nav-icon">&lt;/&gt;</span>
                <span class="nav-title">Ad Generator</span>
            </div>
        </nav>

        <h2>Generiranje objave</h2>

        <label for="group">Izberite starostno skupino:</label>
        <select id="group">
            <option value="7-9">7-9 let</option>
            <option value="10-12">10-12 let</option>
            <option value="13-15">13-15 let</option>
            <option value="16">16+ let</option>
        </select>

        <label>Izberite teme objave (več hkrati):</label>
        <div id="topics-container"
            style="border: 1px solid #ccc; padding: 10px; border-radius: 6px; margin-bottom: 20px; max-height: 150px; overflow-y: auto;">

            <label><input type="checkbox" name="topic" value="Umetna inteligenca"> Umetna inteligenca</label>
            <label><input type="checkbox" name="topic" value="Programiranje iger"> Programiranje iger</label>
            <label><input type="checkbox" name="topic" value="Minecraft"> Minecraft</label>
            <label><input type="checkbox" name="topic" value="Razvoj spletnih strani"> Razvoj spletnih strani</label>
            <label><input type="checkbox" name="topic" value="Brezplačne delavnice"> Brezplačne delavnice</label>
            <label><input type="checkbox" name="topic" value="Varnost na spletu"> Varnost na spletu</label>
            <label><input type="checkbox" name="topic" value="Appinventor"> Appinventor</label>
            <label><input type="checkbox" name="topic" value="Algoritmi"> Algoritmi</label>
            <label><input type="checkbox" name="topic" value="Python"> Python</label>

        </div>

        <label for="description">Opis objave:</label>
        <textarea id="description" rows="4" placeholder="Opiši kaj želiš v objavi..."
            style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-bottom:20px; font-size:16px;"></textarea>

        <button onclick="generate()">Generiraj predogled</button>

        <div id="preview" class="preview" style="display:none; margin-top:20px;">
            <h3>Končni predogled</h3>

            <textarea id="post-text" rows="30" readonly
                style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px;"></textarea>

            <br>
            <strong id="post-reach"></strong>

            <div class="actions">

                <!-- EDIT -->
                <button class="icon-btn" onclick="enableEdit()" title="Uredi">
                    <svg fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M16.862 3.487a2.25 2.25 0 113.182 3.182L7.5 19.213 3 21l1.787-4.5L16.862 3.487z"/>
                    </svg>
                </button>

                <!-- COPY -->
                <button class="icon-btn" onclick="copyPost()" title="Kopiraj">
                    <svg fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg>
                </button>

            </div>
        </div>

    </div>

    <script>
        async function generate() {
            const description = document.getElementById('description').value;
            const groupVal = document.getElementById('group').value;

            const selectedTopics = Array.from(document.querySelectorAll('input[name="topic"]:checked'))
                .map(cb => cb.value);

            if (selectedTopics.length === 0) {
                alert('Prosimo, izberite vsaj eno temo.');
                return;
            }

            const topicString = selectedTopics.join(", ");

            try {
                const response = await fetch('http://localhost:5000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        group: groupVal,
                        topic: topicString,
                        description: description
                    })
                });

                const data = await response.json();

                const textarea = document.getElementById('post-text');
                textarea.value = data.text;
                textarea.setAttribute("readonly", true);

                document.getElementById('post-reach').innerText = data.reach || "";
                document.getElementById('preview').style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Napaka pri generiranju.");
            }
        }

        function enableEdit() {
            const textarea = document.getElementById('post-text');
            textarea.removeAttribute("readonly");
            textarea.focus();
        }

        function copyPost() {
            const text = document.getElementById('post-text').value;

            navigator.clipboard.writeText(text)
                .then(() => alert("Kopirano!"))
                .catch(err => console.error(err));
        }
    </script>
</body>

</html>
