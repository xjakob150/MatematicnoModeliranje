<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija | Coding Giants</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-100 via-orange-50 to-slate-200">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 p-8 sm:rounded-2xl shadow-none sm:shadow-2xl border-none sm:border border-orange-100 flex flex-col justify-center">
        <div class="text-center mb-8">
            <span class="text-orange-500 font-bold text-5xl">&lt;/&gt;</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-4">Ustvari račun</h2>
        </div>

        <div id="error" class="mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-sm hidden"></div>

        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="ime" placeholder="Ime" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-gray-50">
                <input type="text" id="priimek" placeholder="Priimek" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-gray-50">
            </div>
            <input type="email" id="email" placeholder="Email" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-gray-50">
            <input type="password" id="geslo" placeholder="Geslo" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-gray-50">
            
            <button onclick="registracija()" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform text-lg mt-4">Registriraj se</button>
        </div>

        <p class="mt-8 text-center text-gray-600">
            Že imaš račun? <a href="/prijava-stran" class="text-orange-600 font-bold">Prijavi se</a>
        </p>
    </div>

    <script>
        async function registracija() {
            const payload = {
                ime: document.getElementById("ime").value,
                priimek: document.getElementById("priimek").value,
                email: document.getElementById("email").value,
                geslo: document.getElementById("geslo").value
            };
            try {
                const response = await fetch("/registracija", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (response.ok) window.location.href = "/prijava-stran";
                else {
                    const data = await response.json();
                    document.getElementById("error").innerText = data.napaka;
                    document.getElementById("error").classList.remove("hidden");
                }
            } catch (err) { alert("Napaka pri povezavi."); }
        }
    </script>
</body>
</html>
