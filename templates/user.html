<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Profil | Coding Giants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-orange-100 via-orange-50 to-slate-200 font-sans overflow-x-hidden">

    <nav
        class="fixed top-0 left-0 w-full h-16 bg-white shadow-sm flex items-center justify-between px-6 z-[110] border-b border-orange-100">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <span class="text-orange-500 font-bold text-xl">&lt;/&gt;</span>
                <span class="font-bold text-gray-700 hidden sm:inline">Ad Generator</span>
            </div>

            <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

            <div class="flex items-center gap-4 text-sm font-semibold">
                <a href="/index.html" class="text-gray-500 hover:text-orange-500 transition-colors">Generator</a>
                <a href="/user-stran" class="text-orange-600 border-b-2 border-orange-500 pb-1">Moj Profil</a>
            </div>
        </div>
        <button onclick="logout()"
            class="text-sm font-semibold text-gray-500 hover:text-orange-600 transition-colors">Odjava</button>
    </nav>

    <div class="pt-24 pb-12 px-4 sm:px-10 max-w-5xl mx-auto flex flex-col gap-8">

        <div
            class="bg-white p-6 sm:p-10 sm:rounded-2xl shadow-none sm:shadow-2xl border-none sm:border border-orange-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-orange-100 rounded-bl-full opacity-50"></div>

            <h2 class="text-2xl sm:text-3xl font-bold text-orange-500 mb-2 relative z-10">Osebni podatki</h2>
            <div class="h-1 w-16 bg-orange-500 rounded-full mb-8 relative z-10"></div>

            <div id="user-info-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6 relative z-10">
                <p class="text-gray-500 text-sm">Nalagam podatke...</p>
            </div>
        </div>

        <div
            class="bg-white p-6 sm:p-10 sm:rounded-2xl shadow-none sm:shadow-2xl border-none sm:border border-orange-100">
            <h2 class="text-2xl sm:text-3xl font-bold text-orange-500 mb-2">Razpoložljivi tečaji</h2>
            <div class="h-1 w-16 bg-orange-500 rounded-full mb-8"></div>

            <div id="courses-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-500 text-sm col-span-full">Nalagam tečaje...</p>
            </div>
        </div>

    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "/prijava-stran";

        window.onload = function () {
            loadUserData();
            loadCourses();
        };

        async function loadUserData() {
            const container = document.getElementById("user-info-container");

            try {
                const response = await fetch('/uporabnik', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const user = await response.json();

                    container.innerHTML = `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Ime in priimek</p>
                            <p class="text-lg font-bold text-gray-800">${user.ime} ${user.priimek}</p>
                        </div>

                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Email naslov</p>
                            <p class="text-lg font-bold text-gray-800">${user.email}</p>
                        </div>

                        <div class="sm:col-span-2 flex justify-center">
                            <button onclick="toggleEditForm()"
                                class="bg-orange-500 text-white font-bold px-6 py-3 rounded-xl hover:bg-orange-600 transition-colors">
                                Uredi podatke
                            </button>
                        </div>

                        <div id="edit-profile-form" class="hidden sm:col-span-2 bg-orange-50 p-5 rounded-xl border border-orange-100">
                            <h3 class="text-lg font-bold text-gray-800 mb-4">Uredi podatke</h3>

                            <div id="profile-message" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Ime</label>
                                    <input id="edit-first-name" type="text" value="${user.ime}"
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-white">
                                </div>

                                <div>
                                    <label class="block text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Priimek</label>
                                    <input id="edit-last-name" type="text" value="${user.priimek}"
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-white">
                                </div>
                            </div>

                            <div class="mt-4">
                                <label class="block text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Email naslov</label>
                                <input id="edit-email" type="email" value="${user.email}"
                                    class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none bg-white">
                            </div>

                            <input id="edit-password" type="password" placeholder="Novo geslo - pusti prazno, če ga ne spreminjaš"
                                class="w-full mt-4 px-4 py-3 border border-gray-200 rounded-xl outline-none bg-white">

                            <button onclick="saveProfile()"
                                class="mt-4 bg-orange-500 text-white font-bold px-6 py-3 rounded-xl hover:bg-orange-600 transition-colors">
                                Shrani spremembe
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<p class="text-red-500 text-sm">Napaka pri pridobivanju profila. Morda morate ponovno prijaviti.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">Napaka v povezavi.</p>';
            }
        }

        function toggleEditForm() {
            const form = document.getElementById("edit-profile-form");
            form.classList.toggle("hidden");
        }

        async function saveProfile() {
            const message = document.getElementById("profile-message");

            const payload = {
                first_name: document.getElementById("edit-first-name").value,
                last_name: document.getElementById("edit-last-name").value,
                email: document.getElementById("edit-email").value,
                new_password: document.getElementById("edit-password").value
            };

            try {
                const response = await fetch('/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                message.classList.remove("hidden");

                if (response.ok) {
                    message.className = "mb-4 p-3 rounded-lg text-sm bg-green-100 text-green-700";
                    message.innerText = data.message;
                    loadUserData();
                } else {
                    message.className = "mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700";
                    message.innerText = data.error;
                }
            } catch (error) {
                message.classList.remove("hidden");
                message.className = "mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700";
                message.innerText = "Connection error.";
            }
        }

        async function loadCourses() {
            const container = document.getElementById("courses-container");

            try {
                const response = await fetch('/starostne-skupine');

                if (response.ok) {
                    const courses = await response.json();

                    if (courses.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 italic col-span-full">Trenutno ni na voljo nobenih tečajev.</p>';
                        return;
                    }

                    container.innerHTML = courses.map(course => `
                        <div class="flex flex-col p-5 bg-white border border-orange-100 rounded-2xl hover:shadow-lg hover:border-orange-300 transition-all group">
                            <div class="bg-orange-100 text-orange-600 text-xs font-bold px-3 py-1 rounded-full w-max mb-4">
                                ${course.starostna_skupina}
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mb-2 group-hover:text-orange-600 transition-colors">${course.ime_tecaja}</h3>
                            <div class="mt-auto pt-4 border-t border-gray-100 flex justify-between items-center">
                                <span class="text-sm text-gray-500 font-medium">Cena:</span>
                                <span class="text-lg font-bold text-emerald-600">${course.cena} €</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-red-500 text-sm col-span-full">Napaka pri pridobivanju tečajev.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 text-sm col-span-full">Napaka v povezavi.</p>';
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/prijava-stran";
        }
    </script>
</body>

</html>
