version: "3.8"

name: matematicnomodeliranje

services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_DATABASE: matematicnomodeliranje
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - ./matematicnomodeliranje.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - appnet

  web:
    image: xjakob150/matematicnomodeliranje:web
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - appnet
    volumes:
    - /tmp:/tmp

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - appnet

networks:
  appnet:

volumes:
  db_data: