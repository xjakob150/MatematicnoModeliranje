name: Build Docker image and call webhook

on:
  push:
    branches:
      - maste

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            xjakob150/matematicnomodeliranje:web
            xjakob150/matematicnomodeliranje:${{ github.sha }}

  call-webhook:
    name: Send webhook to server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: Call webhook endpoint
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"status":"success","image":"xjakob150/matematicnomodeliranje:web","commit":"${{ github.sha }}"}'
